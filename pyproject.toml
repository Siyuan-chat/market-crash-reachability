[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-crash-reachability"
version = "1.0.0rc1"
description = "Reproducibility companion to When Can Markets Crash Without News?"
requires-python = ">=3.10"
authors = [{name = "Siyuan Ye"}]
license = {text = "MIT (software only; see NOTICE.md for research-artifact exclusions)"}
dependencies = ["numpy==2.1.3", "scipy==1.14.1", "matplotlib==3.9.2", "sympy==1.13.3", "mpmath==1.3.0"]

[tool.setuptools]
packages = []

[project.optional-dependencies]
pdf-validation = ["pymupdf==1.28.2"]
