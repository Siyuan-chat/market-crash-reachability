name: V14 Lean proof lane
on:
  push:
    paths:
      - 'formal/v14/**'
      - 'formal/V14_RESULT_MANIFEST.md'
      - '.github/workflows/v14-lean.yml'
  pull_request:
    paths:
      - 'formal/v14/**'
      - 'formal/V14_RESULT_MANIFEST.md'
      - '.github/workflows/v14-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v14-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable historical sources and V14 working overlays
        run: python scripts/check_revision_hashes.py
      - name: V14 source / theorem roster audit
        run: python formal/v14/check_integrity.py --static
      - name: Install pinned Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.19.0
      - name: Build original source-faithful theorem library
        working-directory: formal/lean
        run: |
          lake exe cache get
          lake build
      - name: Audit original theorem dependencies
        run: python formal/check_proof_integrity.py
      - name: Elaborate and axiom-audit new V14 theorems
        run: python formal/v14/check_integrity.py
