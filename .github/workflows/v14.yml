name: V14 analytical manuscript
on:
  push:
    paths: ['submission/v14-turnover-dissipation/**','scripts/*v14*','verification/loss_breadth/**','verification/twin_ten_asset_benchmarks.py','data/twin_ten_asset_benchmarks.json','.github/workflows/v14.yml']
  pull_request:
    paths: ['submission/v14-turnover-dissipation/**','scripts/*v14*','verification/loss_breadth/**','verification/twin_ten_asset_benchmarks.py','data/twin_ten_asset_benchmarks.json','.github/workflows/v14.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_v14_resource_bound.py
      - run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-science
      - run: python scripts/build_v14_resource_bound.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-turnover-dissipation-pdf
          path: |
            build/v14-turnover-dissipation/main.pdf
            build/v14-turnover-dissipation/main.log
            build/v14-turnover-dissipation/main.bbl
            build/v14-turnover-dissipation/build_summary.json
            build/v14-turnover-dissipation/pdflatex-*.txt
            build/v14-turnover-dissipation/bibtex.txt

  idealized-twin-benchmarks:
    name: Reconstruct idealized twin ten-asset witnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python verification/twin_ten_asset_benchmarks.py --check

  ode-audit:
    name: Independent loss-breadth ODE audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1'
      - run: python verification/loss_breadth_ode_crosscheck.py

  extended-loss-breadth:
    name: Verify twelve rational loss-breadth controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all fixed rational controls and SHA-256 provenance
        run: python verification/loss_breadth/verify_all.py
      - name: Require enabled Python assertions
        run: |
          if python -O verification/loss_breadth/verify_all.py > /tmp/loss-breadth-opt.log 2>&1; then
            echo 'ERROR: optimized Python unexpectedly certified results'
            exit 1
          fi
          grep -F 'rejects optimized Python' /tmp/loss-breadth-opt.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twelve-loss-breadth-certificates
          path: |
            verification/loss_breadth/phase3_certification_suite_results.json
            verification/loss_breadth/phase4_certificate_*.json

  publish-pdf:
    name: Commit validated V14 PDF to main
    needs: [build, ode-audit, extended-loss-breadth]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v14-turnover-dissipation-pdf
          path: build/v14-turnover-dissipation
      - name: Verify PDF identity against successful build
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os

          output = Path("build/v14-turnover-dissipation")
          pdf = output / "main.pdf"
          summary = json.loads((output / "build_summary.json").read_text())
          content = pdf.read_bytes()
          assert len(content) > 50000 and content.startswith(b"%PDF-")
          actual = hashlib.sha256(content).hexdigest()
          assert not summary["problems"], summary["problems"]
          assert actual == summary["pdf_sha256"], (actual, summary["pdf_sha256"])

          destination = Path("submission/v14-turnover-dissipation")
          (destination / "manuscript.pdf").write_bytes(content)
          summary["source_commit"] = os.environ["GITHUB_SHA"]
          summary["workflow_run"] = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/"
              f"actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          (destination / "manuscript-build.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )
          print("Validated V14 PDF:", actual)
          PY
      - name: Commit compiled PDF and provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- submission/v14-turnover-dissipation/manuscript.pdf submission/v14-turnover-dissipation/manuscript-build.json
          if git diff --cached --quiet; then
            echo 'V14 PDF already matches current build'
          else
            git commit -m "Store V14 compiled PDF and source provenance"
            git push origin HEAD:main
          fi

