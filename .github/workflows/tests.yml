name: Reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the 80000-step certificate and figure regeneration
        type: boolean
        default: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: python scripts/check_revision_hashes.py
      - run: python scripts/run_checks.py quick
      - if: github.event_name == 'workflow_dispatch' && inputs.full
        run: python scripts/run_checks.py full
      - if: github.event_name == 'workflow_dispatch' && inputs.full
        run: python scripts/reproduce_figures.py
      - if: github.event_name == 'workflow_dispatch' && inputs.full
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended
          python scripts/build_papers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            build/logs/
            build/final_interval_certificate.json
            data/*.json
            verification/v6_multiday_checks.json
            release/rebuilt/
