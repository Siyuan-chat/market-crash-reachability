name: Loss-breadth interval certificates
on:
  pull_request:
    paths:
      - 'verification/loss_breadth/**'
      - 'submission/v14-turnover-dissipation/main.tex'
      - 'docs/V14_LOSS_BREADTH_CERTIFICATES.md'
      - '.github/workflows/loss-breadth.yml'
  push:
    paths:
      - 'verification/loss_breadth/**'
      - 'submission/v14-turnover-dissipation/main.tex'
      - 'docs/V14_LOSS_BREADTH_CERTIFICATES.md'
      - '.github/workflows/loss-breadth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  directed-interval-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 12 positive-price, dollar-closed loss-breadth witnesses
        run: python verification/loss_breadth/certify_loss_breadth.py
      - name: Audit paper-table source alignment
        run: python verification/loss_breadth/check_paper_sync.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loss-breadth-rational-interval-evidence
          path: |
            build/loss_breadth/certificates.json
            build/loss_breadth/summaries.json
            build/loss_breadth/decoded_phase4_schedules.json
