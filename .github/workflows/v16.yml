name: V16 three certified ten-asset constructions
on:
  push:
    paths:
      - 'submission/v16-three-certified-constructions/**'
      - 'scripts/check_v16_three_constructions.py'
      - 'scripts/build_v16_three_constructions.py'
      - 'verification/two_day_25pct_five_assets.py'
      - 'verification/audit_two_day_25pct.py'
      - 'verification/audit_two_day_25pct_squared_interval.py'
      - 'scripts/generate_v16_path_figure.py'
      - '.github/workflows/v16.yml'
  pull_request:
    paths:
      - 'submission/v16-three-certified-constructions/**'
      - 'scripts/check_v16_three_constructions.py'
      - 'scripts/build_v16_three_constructions.py'
      - 'verification/two_day_25pct_five_assets.py'
      - 'verification/audit_two_day_25pct.py'
      - 'verification/audit_two_day_25pct_squared_interval.py'
      - 'scripts/generate_v16_path_figure.py'
      - '.github/workflows/v16.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-v16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate V16 paper scope and mathematical labels
        run: python scripts/check_v16_three_constructions.py
      - name: Prove exact 25% lower-limit construction independently of PDF
        run: |
          python verification/two_day_25pct_five_assets.py
          python verification/audit_two_day_25pct.py
          python verification/audit_two_day_25pct_squared_interval.py
      - name: Install TeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-science poppler-utils
      - name: Build independently numbered V16 paper with first-citation bibliography
        run: python scripts/build_v16_three_constructions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-certified-three-constructions-pdf
          path: |
            build/v16-three-certified-constructions/main.pdf
            build/v16-three-certified-constructions/main.log
            build/v16-three-certified-constructions/build_summary.json
            build/v16-three-certified-constructions/main.bbl
            build/v16-three-certified-constructions/pdflatex-*.txt
            build/v16-three-certified-constructions/bibtex.txt
  check-existing-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python verification/twin_ten_asset_benchmarks.py --check
