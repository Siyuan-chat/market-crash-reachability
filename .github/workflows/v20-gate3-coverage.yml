name: V20 Gate 3 draft coverage and algebra checks (non-certifying)
on:
  pull_request:
    paths:
      - 'research/v20-gate3/**'
      - 'submission/v20-gate3-activity-recovery/**'
      - '.github/workflows/v20-gate3-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'research/v20-gate3/**'
      - 'submission/v20-gate3-activity-recovery/**'
      - '.github/workflows/v20-gate3-coverage.yml'
  workflow_dispatch:
jobs:
  verify-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 43-item manuscript and figure paths
        run: python research/v20-gate3/check_gate3_draft.py
      - name: Exact rational regression for new scoped lemmas
        run: python research/v20-gate3/audit_new_math.py
      - name: Audit exact rational finite-budget two-node witness
        run: python research/v20-gate3/audit_two_asset_finite_witness.py
      - name: Validate full V16 bibliography corpus and V20 citation keys
        run: python research/v20-gate3/audit_bibliography.py --strict-original
